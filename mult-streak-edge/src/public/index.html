<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Light and dark mode: sets data-theme before the first paint (platform/src/theme/README.md; test/theme.test.ts pins it) -->
    <script>(function(){var t;try{t=localStorage.getItem('hw-theme')}catch{}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
    <!-- The switch (<hw-theme-toggle>), a pinned copy of platform/src/theme/hw-theme.js -->
    <script defer src="hw-theme.js"></script>
    <title>Streak: the multiplication &amp; factoring game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #14110d;
        --paper: #f3efe6;
        --card: #fbf9f4;
        --line: #e0d8c8;
        /* The answer field's and the mode buttons' edges: 3:1 on the card (--line is for dividers). */
        --field-border: #857b6c;
        --field-bg: #ffffff;
        --muted: #6b6256;
        /* Accent text; the filled buttons are --primary with --on-primary on it. */
        --accent: #b3431f;
        --primary: #b3431f;
        --primary-hover: #933516;
        --on-primary: #ffffff;
        --good: #2f6d3b;
        --gold: #b8860b;
        --dot: rgba(20, 17, 13, 0.05);
        --shadow: rgba(20, 17, 13, 0.08);
      }
      /* Dark twice, for the switch (data-theme on <html>, set before the first paint) and for the device setting when
         scripts do not run (platform/src/theme/README.md); test/theme.test.ts keeps the two the same. Both are for
         the screen only: paper gets the light set. */
      @media screen {
        :root[data-theme="dark"] {
          color-scheme: dark;
          --ink: #f1ece2;
          --paper: #16130f;
          --card: #211d17;
          --line: #3a342a;
          --field-border: #857b6b;
          --field-bg: #16130f;
          --muted: #b3a999;
          --accent: #f08a65;
          --primary-hover: #9c3a1a;
          --good: #7cc68a;
          --gold: #e6b847;
          --dot: rgba(241, 236, 226, 0.06);
          --shadow: rgba(0, 0, 0, 0.4);
        }
      }
      @media screen and (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --ink: #f1ece2;
          --paper: #16130f;
          --card: #211d17;
          --line: #3a342a;
          --field-border: #857b6b;
          --field-bg: #16130f;
          --muted: #b3a999;
          --accent: #f08a65;
          --primary-hover: #9c3a1a;
          --good: #7cc68a;
          --gold: #e6b847;
          --dot: rgba(241, 236, 226, 0.06);
          --shadow: rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        background: var(--paper);
        background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
        background-size: 26px 26px;
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px 28px 28px;
        box-shadow: 0 12px 40px var(--shadow);
        text-align: center;
      }
      /* The title, centred as the card is, and the switch at the end of its row. */
      .card-head .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 4px; }
      hw-theme-toggle:not([hidden]) { display: inline-flex; flex: none; width: var(--hw-theme-toggle-size, 44px); height: var(--hw-theme-toggle-size, 44px); }
      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 700;
        font-size: 28px;
        margin: 0;
        flex: 1 1 auto;
        min-width: 0;
        padding-left: 56px;
      }
      .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
      .mode-btns {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .mode-btn {
        flex: 1;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 14px;
        font-weight: 700;
        padding: 10px 12px;
        border: 2px solid var(--field-border);
        border-radius: 10px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        margin-top: 0;
        width: auto;
        transition: border-color 0.1s, color 0.1s;
      }
      .mode-btn.active {
        background: var(--primary);
        color: var(--on-primary);
        border-color: var(--primary);
      }
      .mode-btn:hover:not(.active) {
        border-color: var(--accent);
        color: var(--accent);
      }
      .streak {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted);
      }
      .streak b { color: var(--accent); font-size: 18px; }
      .dots { margin: 10px 0 22px; font-size: 20px; letter-spacing: 4px; min-height: 24px; }
      .problem {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 44px;
        font-weight: 700;
        margin: 6px 0 20px;
        line-height: 1.2;
      }
      .factor-label {
        display: block;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 2px;
      }
      input[type='text'] {
        width: 100%;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 22px;
        text-align: center;
        padding: 14px;
        border: 2px solid var(--field-border);
        border-radius: 12px;
        background: var(--field-bg);
        color: var(--ink);
      }
      input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
      button {
        margin-top: 14px;
        width: 100%;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 17px;
        font-weight: 700;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: var(--on-primary);
        cursor: pointer;
      }
      button:hover { background: var(--primary-hover); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .feedback { margin-top: 16px; min-height: 24px; font-weight: 500; }
      .feedback.good { color: var(--good); }
      .feedback.bad { color: var(--accent); }
      .banner {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 24px;
        font-weight: 700;
        color: var(--gold);
        margin: 8px 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        .problem { transition: opacity 0.12s; }
      }
      /* On paper: the light set, without the switch. A filled button's label takes the ink (browsers leave backgrounds
         out). */
      @media print {
        hw-theme-toggle { display: none !important; }
        button, .mode-btn.active { color: var(--ink); }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <header class="card-head">
        <div class="title-row">
          <h1>Streak</h1>
          <hw-theme-toggle></hw-theme-toggle>
        </div>
      </header>
      <p class="sub" id="sub">Ten in a row wins.</p>
      <div id="mode-select" style="display:none">
        <div class="mode-btns">
          <button class="mode-btn" id="mode-mult" type="button">&times; Multiplication</button>
          <button class="mode-btn" id="mode-factor" type="button">&#247; Factoring</button>
        </div>
      </div>
      <div id="game">
        <p class="streak">Current streak <b id="streak">0</b> / 10</p>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="problem" id="problem">&hellip;</div>
        <label for="answer" style="position:absolute;left:-9999px">Your answer</label>
        <input id="answer" type="text" autocomplete="off" placeholder="?" />
        <button id="submit" type="button">Check answer</button>
        <p class="feedback" id="feedback"></p>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const state = { problem: null, locked: false, mode: 'mult', streak: 0 };

      function renderDots(streak) {
        $('dots').textContent = '●'.repeat(streak) + '○'.repeat(Math.max(0, 10 - streak));
      }

      function updateModeSelect() {
        const show = !state.locked && state.streak === 0;
        $('mode-select').style.display = show ? 'block' : 'none';
        $('mode-mult').classList.toggle('active', state.mode === 'mult');
        $('mode-factor').classList.toggle('active', state.mode === 'factor');
      }

      function showProblem(p, streak, mode) {
        state.problem = p;
        state.locked = false;
        state.mode = mode;
        state.streak = streak;
        $('streak').textContent = streak;
        renderDots(streak);

        if (mode === 'mult') {
          $('sub').textContent = 'Solve the multiplication. Ten in a row wins.';
          $('problem').textContent = `${p.a} × ${p.b}`;
          $('answer').inputMode = 'numeric';
          $('answer').placeholder = '?';
        } else {
          $('sub').textContent = 'Enter the prime factorization. Ten in a row wins.';
          $('problem').innerHTML =
            '<span class="factor-label">Factor this number</span>' +
            p.n.toLocaleString();
          $('answer').inputMode = 'text';
          $('answer').placeholder = 'e.g. 2 × 3 × 5';
        }

        $('answer').disabled = false;
        $('submit').disabled = false;
        $('answer').value = '';
        $('answer').focus();
        updateModeSelect();
      }

      function showLocked(ms, streak, mode) {
        state.locked = true;
        state.streak = streak;
        state.mode = mode ?? state.mode;
        $('streak').textContent = streak;
        renderDots(10);
        const hrs = Math.ceil(ms / 3600000);
        $('problem').innerHTML = '<span class="banner">🏆 You win!</span>';
        $('answer').disabled = true;
        $('submit').disabled = true;
        $('feedback').className = 'feedback good';
        $('feedback').textContent = `Come back in about ${hrs} hour(s) to play again.`;
        updateModeSelect();
      }

      function apply(data) {
        if (data.status === 'locked') {
          showLocked(data.lockoutRemainingMs, data.streak, data.mode);
        } else {
          showProblem(data.problem, data.streak, data.mode);
        }
      }

      async function load() {
        try {
          const res = await fetch('/api/state');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          apply(await res.json());
        } catch {
          $('problem').textContent = 'Could not load a problem';
          $('feedback').className = 'feedback bad';
          $('feedback').textContent = 'The server is not responding. Please refresh in a moment.';
        }
      }

      async function submit() {
        if (state.locked || !state.problem) return;
        let answer;
        if (state.mode === 'mult') {
          answer = Number($('answer').value);
          if (!Number.isFinite(answer)) return;
        } else {
          answer = $('answer').value.trim();
          if (!answer) return;
        }
        $('submit').disabled = true;
        const res = await fetch('/api/answer', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ answer }),
        });
        const data = await res.json();
        const fb = $('feedback');
        if (data.outcome === 'correct' || data.outcome === 'won') {
          fb.className = 'feedback good';
          fb.textContent = 'Correct!';
        } else if (data.outcome === 'wrong') {
          fb.className = 'feedback bad';
          if (data.correctFactors) {
            const factorsStr = data.correctFactors.join(' × ');
            fb.textContent = `Not quite — ${data.correctValue} = ${factorsStr}. Streak reset.`;
          } else {
            fb.textContent = `Not quite — the answer was ${data.correctValue}. Streak reset.`;
          }
        }
        apply(data);
      }

      async function selectMode(mode) {
        try {
          const res = await fetch('/api/mode', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ mode }),
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          $('feedback').className = 'feedback';
          $('feedback').textContent = '';
          apply(await res.json());
        } catch {
          $('feedback').className = 'feedback bad';
          $('feedback').textContent = 'Could not switch mode. Please refresh.';
        }
      }

      $('submit').addEventListener('click', submit);
      $('answer').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      $('mode-mult').addEventListener('click', () => selectMode('mult'));
      $('mode-factor').addEventListener('click', () => selectMode('factor'));
      load();
    </script>
  </body>
</html>

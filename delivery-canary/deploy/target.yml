# Deploy control file for Delivery Canary (Netlify: static page + one function,
# with a Supabase schema).
#
# The page reads delivery emails in the browser. Testing a download link on
# another site needs a server, because a web page cannot read another site's
# file, so /api/* runs as the Netlify function `api` (bundled by
# `npm run build` into netlify/functions/api.mjs). The function holds no
# secret: it acts with the signed-in user's own token, and the public
# Supabase URL and anon key are baked in from `env` below.
# `supabase: true` makes the Deploy workflow apply supabase/migrations/*.sql
# and expose schema app_delivery_canary before the Netlify deploy. `env` holds
# the public client values from platform/supabase.json (public by design; row
# level security guards the rows; the service-role key never appears here).
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.
# Deploys: milestone 1 (delivery email check), 2026-11-12.

provider: netlify
projectName: delivery-canary
directory: delivery-canary
build: npm ci && npm run build
publish: dist

supabase: true
env:
  VITE_SUPABASE_URL: https://auth.hintwise.org
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE

envPassthrough: []

netlify:
  functionsDir: netlify/functions
  siteName: delivery-canary
  # Primary domain; the runner swaps in APP_DOMAIN (hintwise.org) and creates the Cloudflare CNAME (DNS only).
  customDomain: delivery-canary.pisan.me
  accountSlug: yusuf-pisan

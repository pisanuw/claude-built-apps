# Deploy control file for GPU Parallel Puzzler (Netlify, static site).
#
# No backend and no environment variables: the kernel language, the simulated
# GPU, grading, hints and the instructor exports all run in the browser. The
# deploy workflow auto-discovers this file via the `*/deploy/target.yml` glob.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: gpu-parallel-puzzler
directory: gpu-parallel-puzzler
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: gpu-parallel-puzzler
  accountSlug: yusuf-pisan
  # Primary domain; the CNAME lives in Cloudflare (DNS only).
  customDomain: gpu-parallel-puzzler.pisan.me

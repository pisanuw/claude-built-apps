# Deploy control file for Heard-As Check (Netlify, static site with a Supabase schema).
# The deploy workflow auto-discovers `*/deploy/target.yml`.
#
# Milestone 1 (2026-11-27): the first deploy, the page alone. `supabase: true`
# makes the Deploy workflow apply supabase/migrations/0001_init.sql (touching
# only app_heard_as_check; standing authorization 3), expose the schema and run
# check-schema. `env` holds the build's public values (SPEC section 6, public
# by design): the client values from platform/supabase.json, and the capture
# mount's address on backend-hub (VITE_CHECK_URL), which the page first uses
# in milestone 3; the milestone-1 page asks it nothing. The service-role key
# never appears here. package-lock.json is force-added (the root .gitignore
# excludes lockfiles) because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: heard-as-check
directory: heard-as-check
build: npm ci && npm run build
publish: dist

supabase: true
env:
  VITE_SUPABASE_URL: https://auth.hintwise.org
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE
  VITE_CHECK_URL: https://backend-hub-wk2e.onrender.com/heard-as-check

envPassthrough: []

netlify:
  # No serverless functions: the page talks to Supabase, and from milestone 3 to the capture mount.
  functionsDir: ''
  siteName: heard-as-check
  # Primary domain; the runner swaps in APP_DOMAIN (hintwise.org) and creates the Cloudflare CNAME (DNS only).
  customDomain: heard-as-check.pisan.me
  accountSlug: yusuf-pisan

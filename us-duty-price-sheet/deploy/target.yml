# Deploy control file for US Duty Price Sheet (Netlify, static site).
#
# No backend and no environment variables: the catalogue is kept in the
# visitor's browser, and the US tariff data is bundled at build time
# (npm run refresh-hts, then commit). The deploy workflow auto-discovers this
# file via the `*/deploy/target.yml` glob.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI or tariff-data changes.

provider: netlify
projectName: us-duty-price-sheet
directory: us-duty-price-sheet
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: us-duty-price-sheet
  # Primary domain; the runner swaps in APP_DOMAIN (hintwise.org) and creates the Cloudflare CNAME (DNS only).
  customDomain: us-duty-price-sheet.pisan.me
  accountSlug: yusuf-pisan

# Deploy control file for Four Ghosts, Four Targets (Netlify, static site).
#
# No backend and no environment variables: the simulation, the lesson
# scenarios and the greedy-vs-search experiments all run in the browser
# (experiments in a Web Worker). The deploy workflow auto-discovers this file
# via the `*/deploy/target.yml` glob. package-lock.json is force-added (the
# root .gitignore excludes lockfiles) because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: four-ghosts
directory: four-ghosts
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: four-ghosts-four-targets
  accountSlug: yusuf-pisan

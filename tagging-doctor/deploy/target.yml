# Deploy control file for Tagging Doctor (Netlify, static site).
# Milestone 1: the scan runs in the browser; no functions, no secrets and no
# database yet (`supabase: false`). Milestone 2 adds the schema
# app_tagging_doctor (supabase/migrations/) and sets `supabase: true`;
# milestone 3b adds the worker's address as a VITE_ value in `env`.
# `env` holds the public client values from platform/supabase.json (public by
# design), ready for sign-in in milestone 2; milestone 1 does not use them.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: tagging-doctor
directory: tagging-doctor
build: npm ci && npm run build
publish: dist

supabase: false
env:
  VITE_SUPABASE_URL: https://auth.hintwise.org
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE

envPassthrough: []

netlify:
  # No serverless functions: the scan runs in the browser.
  functionsDir: ''
  siteName: tagging-doctor
  # Primary domain; the runner swaps in APP_DOMAIN (hintwise.org) and creates the Cloudflare CNAME (DNS only).
  customDomain: tagging-doctor.pisan.me
  accountSlug: yusuf-pisan

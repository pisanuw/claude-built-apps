# Deploy control file for Tagging Doctor (Netlify, static site).
# The scan runs in the browser; no functions and no secrets. Since milestone 2
# the app has sign-in and the schema app_tagging_doctor: `supabase: true` makes
# the Deploy workflow apply supabase/migrations/*.sql (touching only that
# schema), expose the schema and run check-schema. The gateway row in
# platform.llm_apps is not in the migration: PManager registers it at the
# release (AC-63). Milestone 3b adds the checker's address as one VITE_ value
# in `env` (VITE_CHECKER_URL; milestone 4 moves the checker into backend-hub
# under a path prefix, so only this line changes then), and the build flag
# VITE_COMPILE_CHECK: "on" shows "Compile and check", "off" hides it. It is
# on from milestone 3b's release (CR-11, need 4; DECISIONS.md D-97): the live
# worker answers compile: true and allows this app's origin. If the owner's
# live math-notes run takes more than 90 s, it goes back to 'off' (CR-11, AC-68),
# and nothing else changes. `env` holds the public
# client values from platform/supabase.json (public by design).
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: tagging-doctor
directory: tagging-doctor
build: npm ci && npm run build
publish: dist

supabase: true
env:
  VITE_SUPABASE_URL: https://auth.hintwise.org
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE
  VITE_CHECKER_URL: https://tagging-doctor-worker.onrender.com
  VITE_COMPILE_CHECK: 'on'

envPassthrough: []

netlify:
  # No serverless functions: the scan runs in the browser.
  functionsDir: ''
  siteName: tagging-doctor
  # Primary domain; the runner swaps in APP_DOMAIN (hintwise.org) and creates the Cloudflare CNAME (DNS only).
  customDomain: tagging-doctor.pisan.me
  accountSlug: yusuf-pisan

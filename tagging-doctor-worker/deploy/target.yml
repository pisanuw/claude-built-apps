# Deploy control file for tagging-doctor-worker (Render web service, Docker).
#
# Tagging Doctor's checker: LuaLaTeX and veraPDF behind a small Node server,
# built from ./Dockerfile (pinned TeX Live 2026 and veraPDF 1.30.4). On
# Render's free instance (owner, 18 November 2026: "2 yes 3 yes"; a paid plan
# needs a new ask with its price). The deploy runner creates the service with
# `dockerfilePath` and `dockerContext` (spec question 1, PManager's answer of
# 19 November 2026); both are relative to `directory`, Render's root
# directory for the service.
#
# It holds no secret: it checks the visitor's Supabase token by asking
# `auth/v1/user` with the public anon key below (the app's, from
# platform/supabase.json, public by design). Not a Netlify site, so no
# footer, analytics or hintwise.org name: the app calls it at the Render
# address the Deploy run prints ("tagging-doctor-worker (render): <url>").
#
# Deploys: the Deploy workflow runs when this file changes on main (it creates
# the service the first time). After that, Render itself rebuilds and
# redeploys the worker on every push to main that touches this folder
# (autoDeploy, set by the runner): each such merge is a production deploy and a
# pull of about 2.9 GB. `[skip render]` in the merge commit's subject skips it.

provider: render
projectName: tagging-doctor-worker
directory: tagging-doctor-worker

env:
  SUPABASE_URL: https://auth.hintwise.org
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE

envPassthrough: []

render:
  type: web_service
  runtime: docker
  dockerfilePath: ./Dockerfile
  dockerContext: .
  plan: free
  region: oregon
  healthCheckPath: /api/health
  branch: main

# Deploy control file for Dossier Comment Reflector (Netlify, static site).
#
# No backend and no environment variables: comments, analysis and the draft
# stay in the visitor's browser. The deploy workflow auto-discovers this file
# via the `*/deploy/target.yml` glob.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: dossier-comment-reflector
directory: dossier-comment-reflector
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: dossier-comment-reflector
  # Primary domain; the deploy runner creates its Cloudflare CNAME (DNS only).
  customDomain: dossier-comment-reflector.pisan.me
  accountSlug: yusuf-pisan

# Deploy control file for emoji-lingua (Netlify).
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship code changes.
provider: netlify
projectName: emoji-lingua
directory: emoji-lingua
build: npm ci && npm run build
publish: dist/public

envPassthrough:
  - ANTHROPIC_API_KEY

netlify:
  functionsDir: netlify/functions
  siteName: emoji-lingua-pisan
  siteId: ''
  accountSlug: ''
  # Primary domain; the CNAME lives in Cloudflare (DNS only).
  customDomain: emoji-lingua.pisan.me

# redeploy: pick up ANTHROPIC_API_KEY in the function runtime

# redeploy: 18k-entry CLDR-generated dictionary

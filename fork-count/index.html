<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Light and dark mode: sets data-theme before the first paint (platform/src/theme/README.md; test/theme.test.ts pins it) -->
    <script>(function(){var t;try{t=localStorage.getItem('hw-theme')}catch{}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
    <title>Fork Count</title>
    <meta
      name="description"
      content="Paste a fork/wait/exit/printf/pipe C snippet and see every process it creates, the data its pipes carry, every output the scheduler could produce (deadlocks included), why other outputs are impossible, and verified exam questions. Runs entirely in the browser."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B4%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"><noscript>Fork Count needs JavaScript; everything runs in your browser.</noscript></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

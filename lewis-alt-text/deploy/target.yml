# Deploy control file for Lewis Structure Alt Text (Netlify, static site; the
# browser calls the LLM gateway or, with the visitor's own key,
# api.anthropic.com). No functions and no secrets.
#
# `supabase: true` makes the Deploy workflow run supabase/migrations/*.sql,
# which only creates the empty schema app_lewis_alt_text and registers the app
# with the gateway (platform.llm_apps). `env` holds the public client values
# from platform/supabase.json (public by design).
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: lewis-alt-text
directory: lewis-alt-text
build: npm ci && npm run build
publish: dist

supabase: true
env:
  VITE_SUPABASE_URL: https://auth.hintwise.org
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE

envPassthrough: []

netlify:
  # No serverless functions; the browser talks to the gateway.
  functionsDir: ''
  siteName: lewis-alt-text
  # Primary domain; the runner swaps in APP_DOMAIN (hintwise.org) and creates the Cloudflare CNAME (DNS only).
  customDomain: lewis-alt-text.pisan.me
  accountSlug: yusuf-pisan

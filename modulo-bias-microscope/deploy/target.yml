# Deploy control file for Modulo Bias Microscope (Netlify, static site).
#
# No backend and no environment variables: student code runs in a Web Worker
# in the browser, and exercises live entirely in their links. The deploy
# workflow auto-discovers this file via the `*/deploy/target.yml` glob.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: modulo-bias-microscope
directory: modulo-bias-microscope
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: modulo-bias-microscope
  accountSlug: yusuf-pisan

# Deploy control file for Donation Receipts (Netlify, static site).
#
# No backend and no environment variables: exports are read in the visitor's
# browser and records are kept there. The deploy workflow auto-discovers this
# file via the `*/deploy/target.yml` glob.
# package-lock.json is force-added (the root .gitignore excludes lockfiles)
# because `npm ci` below needs it.
#
# Code-only pushes do not trigger a deploy: the workflow watches this file, so
# touch it (or run the workflow manually) to ship UI changes.

provider: netlify
projectName: donation-receipts
directory: donation-receipts
build: npm ci && npm run build
publish: dist

envPassthrough: []

netlify:
  # No serverless functions; the whole app is static.
  functionsDir: ''
  siteName: donation-receipts
  # Primary domain; the deploy runner creates its Cloudflare CNAME (DNS only).
  customDomain: donation-receipts.pisan.me
  accountSlug: yusuf-pisan

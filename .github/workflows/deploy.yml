# Self-discovering, config-driven deploy.
#
# To deploy or retarget any app, edit its `<app>/deploy/target.yml` and push.
# Only pushes to main deploy, and a push deploys ONLY the targets whose
# target.yml changed in that push (plus the few apps listed below whose source
# changes also deploy). Nothing else redeploys on its own: a change to the
# shared runner (deploy.mjs), the shared footer (scripts/site-footer.mjs) or
# this file deploys nothing. Every Netlify production deploy costs account
# credits, and redeploying all ~50 apps on every runner edit ran them out on
# 2026-11-02.
#
# To ship a runner or footer change, run this workflow manually and name the
# apps: `bombe-bench cache-miss-theater`, or `all` to redeploy everything.
# If the push's base commit is unavailable (force push), the diff falls back
# to the tip commit's parent. Adding a new app needs no change here: just add
# its directory with a deploy/target.yml.
#
# Required repo secrets (only those relevant to your targets are used):
#   RENDER_API_KEY, NETLIFY_AUTH_TOKEN   deploy targets
#   ANTHROPIC_API_KEY                    forwarded to accessibility-lens
#   RESEND_API, ADMIN_EMAIL, COOKIE_SECRET   forwarded to mult-streak apps
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ZONE_ID   optional: create a new app's
#     <app>.hintwise.org CNAME (see accessibility-lens/deploy/cloudflare-dns.mjs;
#     target.yml's <app>.pisan.me is mapped by scripts/domains.mjs)
#   SUPABASE_ACCESS_TOKEN, SUPABASE_URL   apps with `supabase: true` in target.yml:
#     their supabase/migrations/*.sql run and their schema is exposed before
#     the deploy (platform/supabase-admin.mjs; docs/platform.md)
name: Deploy

on:
  push:
    # Agent sessions push to claude/* branches; those must never deploy.
    branches: [main]
    paths:
      - '**/deploy/target.yml'
      - 'shortcut-sprint/**'
      - 'code-analogy-forge/**'
  workflow_dispatch:
    inputs:
      targets:
        description: "App folders to deploy, separated by spaces (e.g. bombe-bench cache-miss-theater), or 'all'"
        required: true
        type: string

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.find.outputs.configs }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the push's before..after diff is always computable.
          fetch-depth: 0
      - id: find
        name: Discover deploy targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGETS: ${{ inputs.targets }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          all=$(ls -1 */deploy/target.yml 2>/dev/null)

          selected=""
          if [ "$EVENT_NAME" != "push" ]; then
            if [ "$(echo "$TARGETS" | xargs)" = "all" ]; then
              echo "Manual run with 'all': deploying every target."
              selected=$all
            else
              for app in $(echo "$TARGETS" | tr ',' ' '); do
                f="$app/deploy/target.yml"
                if [ -f "$f" ]; then selected="$selected$f"$'\n'
                else echo "::error::No $f in the repo."; exit 1; fi
              done
            fi
          else
            base=$BEFORE_SHA
            if ! git cat-file -e "$base" 2>/dev/null; then
              # Force push: there is no trustworthy base, so diff the tip commit only.
              # Run the workflow manually with `all` to redeploy everything.
              base=$(git rev-parse "$AFTER_SHA^" 2>/dev/null || git hash-object -t tree /dev/null)
              echo "Base commit $BEFORE_SHA unavailable: diffing against $base."
            fi
            changed=$(git diff --name-only "$base" "$AFTER_SHA")
            printf 'Changed files:\n%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -qxE 'accessibility-lens/deploy/deploy\.mjs|scripts/site-footer\.mjs'; then
              echo "::notice::Deploy runner or site footer changed. Nothing redeploys for that alone; run this workflow manually to ship it."
            fi
            # Docs, images, the license and an app's own CI file never need a
            # deploy, so they do not count as source changes below.
            code_changed=$(printf '%s\n' "$changed" | grep -vE '/(README\.md|LICENSE|demo\.gif|desktop\.png|mobile\.png)$|^[^/]+/\.github/' || true)
            {
              # Only the target.ymls touched by this push, skipping deleted ones.
              for f in $(printf '%s\n' "$changed" | grep -xE '[^/]+/deploy/target\.yml' || true); do
                [ -f "$f" ] && selected="$selected$f"$'\n'
              done
              if printf '%s\n' "$code_changed" | grep -q '^shortcut-sprint/' \
                && ! printf '%s\n' "$changed" | grep -qx 'shortcut-sprint/deploy/target.yml'; then
                selected="$selected"shortcut-sprint/deploy/target.yml$'\n'
              fi
              if printf '%s\n' "$code_changed" | grep -q '^code-analogy-forge/' \
                && ! printf '%s\n' "$changed" | grep -qx 'code-analogy-forge/deploy/target.yml'; then
                selected="$selected"code-analogy-forge/deploy/target.yml$'\n'
              fi
              if printf '%s\n' "$code_changed" | grep -q '^type-witness/' \
                && ! printf '%s\n' "$changed" | grep -qx 'type-witness/deploy/target.yml'; then
                selected="$selected"type-witness/deploy/target.yml$'\n'
              fi
            }
          fi

          configs=$(printf '%s\n' $selected | grep . | jq -R . | jq -cs .)
          echo "Deploying: $configs"
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

  deploy:
    needs: discover
    if: needs.discover.outputs.configs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.discover.outputs.configs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install deploy runner dependencies
        run: npm install
        working-directory: accessibility-lens/deploy
      - name: Supabase migrations
        # Only for a target.yml with `supabase: true`: applies the app's
        # supabase/migrations/*.sql (recorded in platform.migrations) and
        # exposes schema app_<slug_> through PostgREST. A failed migration
        # fails the job, so the site is not deployed against a half-migrated
        # schema.
        env:
          CONFIG: ${{ matrix.config }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if ! grep -qE '^supabase: *true' "$CONFIG"; then
            echo "No supabase: true in $CONFIG; skipping migrations."
            exit 0
          fi
          SLUG=${CONFIG%%/*}
          SCHEMA="app_$(printf '%s' "$SLUG" | tr '-' '_')"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::$CONFIG has supabase: true but SUPABASE_ACCESS_TOKEN or SUPABASE_URL is not set."
            exit 1
          fi
          echo "Applying $SLUG/supabase/migrations and exposing $SCHEMA"
          node platform/supabase-admin.mjs migrate "$SLUG"
          node platform/supabase-admin.mjs expose-schema "$SCHEMA"
          # Read-only security check (RLS, anon access, definer functions, a
          # signed-in stranger sees no real row, Supabase's advisor): a
          # finding fails the job, so the site is not deployed.
          node platform/supabase-admin.mjs check-schema "$SCHEMA"

      - name: Deploy ${{ matrix.config }}
        run: node accessibility-lens/deploy/deploy.mjs --config "${{ matrix.config }}"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Optional: lets the runner create a new app's <app>.hintwise.org CNAME.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API: ${{ secrets.RESEND_API }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          # delivery-canary: encrypts stored shop credentials (owner, 12 Nov); passed via its target.yml envPassthrough.
          DELIVERY_CANARY_KEY: ${{ secrets.DELIVERY_CANARY_KEY }}

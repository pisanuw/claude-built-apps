# Mirror apps into their own repos under the pisan-labs org.
#
# This monorepo stays the source of truth (CI, deploy, shared footer). Each
# app listed in .github/mirrors.txt is split out with `git subtree split`, so
# its repo gets that folder at its root with its own history, and pushed to
# pisan-labs/<repo> main. A standalone repo per app is easier to find, star
# and fork than one folder among fifty.
#
# A push to main mirrors only the listed apps whose folder changed; a manual
# run mirrors all of them.
#
# To mirror another app: create an EMPTY repo pisan-labs/<repo> (no README,
# or the first push is rejected), copy the root LICENSE and an app-level
# .github/workflows/ci.yml into the app folder (the split only carries that
# folder), then add a line to .github/mirrors.txt.
#
# Secret MIRROR_TOKEN: a fine-grained token, resource owner pisan-labs, with
# Contents and Workflows read/write on the mirror repos (Workflows because
# each app carries its own CI file). Without it the job skips.
name: Mirror apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Otherwise checkout leaves GITHUB_TOKEN in git's extraheader, which
          # overrides MIRROR_TOKEN in the push URL and is refused by pisan-labs.
          persist-credentials: false

      - name: Split and push changed apps
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::MIRROR_TOKEN is not set; skipping."
            exit 0
          fi
          changed=""
          if [ "$EVENT_NAME" = "push" ]; then
            base=$BEFORE_SHA
            git cat-file -e "$base" 2>/dev/null || base=$(git rev-parse "$AFTER_SHA^")
            changed=$(git diff --name-only "$base" "$AFTER_SHA")
          fi
          failed=""
          while read -r app repo; do
            case "$app" in ''|'#'*) continue ;; esac
            if [ "$EVENT_NAME" = "push" ] && ! printf '%s\n' "$changed" | grep -q "^$app/" \
              && ! printf '%s\n' "$changed" | grep -qx '.github/mirrors.txt'; then
              continue
            fi
            echo "::group::$app -> pisan-labs/$repo"
            git branch -D mirror >/dev/null 2>&1 || true
            if git subtree split -q --prefix="$app" -b mirror \
              && git push -q "https://x-access-token:${TOKEN}@github.com/pisan-labs/${repo}.git" mirror:main; then
              echo "pushed"
            else
              echo "::error::Mirroring $app to pisan-labs/$repo failed."
              failed="$failed $app"
            fi
            echo "::endgroup::"
          done < .github/mirrors.txt
          [ -z "$failed" ] || { echo "Failed:$failed"; exit 1; }

# Send one test email through Resend to the owner (ADMIN_EMAIL), to check a
# sending domain is verified. Sends exactly one message per run.
name: Test email

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Sender (must be on a domain verified in Resend)'
        required: true
        default: 'HintWise <builder@hintwise.org>'
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send and check delivery
        env:
          RESEND_API: ${{ secrets.RESEND_API }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FROM: ${{ inputs.from }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg from "$FROM" --arg to "$ADMIN_EMAIL" \
            '{from:$from, to:[$to], subject:"HintWise test email", text:"Test from the claude-built-apps Test email workflow: Resend sending from hintwise.org works."}')
          res=$(curl -sS -w '\n%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API" -H 'Content-Type: application/json' -d "$body")
          code=$(echo "$res" | tail -1); json=$(echo "$res" | sed '$d')
          echo "Send: HTTP $code $json"
          [ "$code" = 200 ] || { echo "::error::Resend refused the message"; exit 1; }
          id=$(echo "$json" | jq -r .id)
          for i in 1 2 3 4 5 6; do
            sleep 10
            ev=$(curl -sS "https://api.resend.com/emails/$id" -H "Authorization: Bearer $RESEND_API" | jq -r '.last_event // "unknown"')
            echo "Status after $((i*10))s: $ev"
            case "$ev" in delivered) echo "::notice::Delivered (id $id)"; exit 0;; bounced|complained|failed) echo "::error::$ev"; exit 1;; esac
          done
          echo "::warning::Accepted by Resend (id $id) but not yet reported delivered"

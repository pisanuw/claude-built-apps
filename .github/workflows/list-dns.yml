# Read-only: list every DNS record in a Cloudflare zone. Writes nothing.
name: List DNS

on:
  workflow_dispatch:
    inputs:
      zone:
        description: 'Zone name, e.g. hintwise.org (blank: the CLOUDFLARE_ZONE_ID zone)'
        required: false
        type: string

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: List
        run: node accessibility-lens/deploy/list-dns.mjs "$ZONE"
        env:
          ZONE: ${{ inputs.zone }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

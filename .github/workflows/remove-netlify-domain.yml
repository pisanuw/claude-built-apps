# Remove a custom domain (primary or alias) from a Netlify site. Deploys
# nothing and leaves DNS alone.
name: Remove Netlify domain

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Netlify site name, e.g. chess-tournament-director'
        required: true
        type: string
      domain:
        description: 'Domain to remove, e.g. chesstd.pisan.me'
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove
        run: node accessibility-lens/deploy/remove-domain.mjs "$SITE" "$DOMAIN"
        env:
          SITE: ${{ inputs.site }}
          DOMAIN: ${{ inputs.domain }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

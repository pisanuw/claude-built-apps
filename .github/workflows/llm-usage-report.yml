# Emails the owner the LLM usage of the HintWise key (docs/platform.md,
# section 4): on days when any app used the owner's key, and every Monday as a
# weekly summary. The decision lives in platform/llm-usage-report.mjs, which
# reads platform.llm_usage_report through PostgREST with the service role and
# sends through Resend from builder@hintwise.org. No state file: the Pacific-
# hour guard and a per-day Resend idempotency key keep it to one email a day.
name: LLM usage report

on:
  schedule:
    # Both fire; the script drops whichever lands before 9am Pacific
    # (16:10 UTC is 9:10am PDT, 17:10 UTC is 9:10am PST). GitHub can delay a
    # scheduled run when it is busy.
    - cron: '10 16 * * *'
    - cron: '10 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render the email to the log without sending'
        type: boolean
        default: false
      force:
        description: 'Send even on a quiet day'
        type: boolean
        default: false

permissions:
  contents: read

# Never let a manual run and the scheduled run send at the same time.
concurrency:
  group: llm-usage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Send the usage report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API: ${{ secrets.RESEND_API }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          args=''
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          # Only the scheduled pair needs the Pacific-morning guard; a manual
          # run should send when you ask for it.
          [ "${{ github.event_name }}" = "schedule" ] && args="$args --not-before-pacific-hour=9"
          node platform/llm-usage-report.mjs $args

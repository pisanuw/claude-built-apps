name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# A newer push to the same branch (or PR) cancels that branch's older run, so a
# burst of pushes tests only the newest commit. On main this means an older
# commit's run can show as cancelled; the newest commit's run covers it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility-lens:
    name: accessibility-lens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accessibility-lens
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: accessibility-lens/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build


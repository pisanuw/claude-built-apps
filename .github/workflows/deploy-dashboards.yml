# Manual: deploy the pisan-analytics dashboard (pisanuw/dashboards, folder
# netlify-analytics) to its Netlify site with this repo's NETLIFY_AUTH_TOKEN,
# the same as `netlify deploy --build --prod` from that folder (owner, 17 Nov
# 2026: "deploy dashboards", option 1, so no token is pasted anywhere).
#
# Every run is a production deploy (Netlify credits). The site's own env vars
# (DASHBOARD_PASSWORD, CRON_SECRET, TZ, APP_EVENTS_REPORT_*) stay on the site;
# this workflow lists their names and never prints a value. It refuses to
# deploy when DASHBOARD_PASSWORD is not set for production, because the
# dashboard would then be open to anyone.
# APP_EVENTS_REPORT_SECRET is set by supabase-admin.yml `report-secret on`.
#
# One token (owner, 27 Nov 2026: "One token"): before each deploy the workflow
# sets the site's NETLIFY_TOKEN, which the sync uses to read Netlify's API, to
# this repo's NETLIFY_AUTH_TOKEN, so there is one Netlify token to renew. The
# value goes from the secret to the API in a request body and is never printed.
# After renewing NETLIFY_AUTH_TOKEN, run this workflow once so the dashboard's
# sync gets the new token too.
#
# After the deploy it checks the gate signed out, with no secret: / goes to
# the sign-in page (pisanuw/dashboards netlify-analytics/netlify/edge-functions/
# auth.js, since 26 Nov 2026; HTTP Basic auth before), /login is the form and
# refuses a wrong password without setting a cookie, and the API paths answer
# 401. A ref from before the sign-in page still passes, with a warning, as long
# as everything answers 401.
name: Deploy dashboards

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'pisanuw/dashboards branch, tag or commit to deploy'
        required: true
        default: 'main'
        type: string

concurrency:
  group: deploy-dashboards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE: pisan-analytics
      NETLIFY_CLI: netlify-cli@27.20.0
    steps:
      - uses: actions/checkout@v7
        with:
          repository: pisanuw/dashboards
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install
        working-directory: netlify-analytics
        run: npm ci

      - name: Find the site and check its password gate
        id: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1$1"; }
          api "/sites/$SITE.netlify.app" > "$RUNNER_TEMP/site.json"
          SITE_ID=$(jq -r .id "$RUNNER_TEMP/site.json"); ACCOUNT=$(jq -r .account_id "$RUNNER_TEMP/site.json")
          [ -n "$SITE_ID" ] && [ "$SITE_ID" != null ] || { echo "::error::Netlify site $SITE not found for this token"; exit 1; }
          echo "Site $SITE: $(jq -r '.ssl_url // .url' "$RUNNER_TEMP/site.json")"
          # Names and contexts only: values never leave the API response.
          api "/accounts/$ACCOUNT/env?site_id=$SITE_ID" > "$RUNNER_TEMP/env.json"
          echo "Site env vars (names only):"
          jq -r '.[] | "  \(.key) (\([.values[].context] | join(",")))"' "$RUNNER_TEMP/env.json"
          GATE=$(jq -r '[.[] | select(.key == "DASHBOARD_PASSWORD") | .values[] | select(.context == "all" or .context == "production")] | length' "$RUNNER_TEMP/env.json")
          rm -f "$RUNNER_TEMP/env.json"
          [ "$GATE" -gt 0 ] || { echo "::error::DASHBOARD_PASSWORD is not set for production on $SITE: the dashboard would be public. Set it on the site first."; exit 1; }
          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r '.ssl_url // .url' "$RUNNER_TEMP/site.json")" >> "$GITHUB_OUTPUT"

      # One token: the sync reads NETLIFY_TOKEN first (pisanuw/dashboards
      # netlify-analytics/src/config.js), so set it to this repo's token before
      # the deploy, which gives the functions the new value. An existing
      # variable keeps its scopes and contexts and only its values change; a
      # missing one is created for every context. Only key names, contexts and
      # HTTP codes are printed.
      - name: Give the site this repo's Netlify token
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: ${{ steps.site.outputs.site_id }}
          ACCOUNT: ${{ steps.site.outputs.account }}
        run: |
          set -euo pipefail
          URL="https://api.netlify.com/api/v1/accounts/$ACCOUNT/env"
          call() { # method, path and query; the body, if any, comes on stdin
            curl -sS -o /dev/null -w '%{http_code}' -X "$1" -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H 'Content-Type: application/json' --data-binary @- "$URL$2"
          }
          code=$(curl -sS -o "$RUNNER_TEMP/var.json" -w '%{http_code}' -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "$URL/NETLIFY_TOKEN?site_id=$SITE_ID")
          if [ "$code" = 200 ]; then
            # Contexts only: the old value stays inside the deleted file.
            jq -c '.values[] | {context, context_parameter}' "$RUNNER_TEMP/var.json" > "$RUNNER_TEMP/contexts.jsonl"
            rm -f "$RUNNER_TEMP/var.json"
            [ -s "$RUNNER_TEMP/contexts.jsonl" ] || echo '{"context":"all","context_parameter":null}' > "$RUNNER_TEMP/contexts.jsonl"
            while read -r c; do
              ctx=$(jq -r .context <<<"$c")
              code=$(jq -c '. + {value: env.NETLIFY_AUTH_TOKEN} | with_entries(select(.value != null))' <<<"$c" \
                | call PATCH "/NETLIFY_TOKEN?site_id=$SITE_ID")
              echo "NETLIFY_TOKEN ($ctx): HTTP $code"
              [ "$code" = 200 ] || [ "$code" = 201 ] || { echo "::error::could not set NETLIFY_TOKEN ($ctx) on the site"; exit 1; }
            done < "$RUNNER_TEMP/contexts.jsonl"
            rm -f "$RUNNER_TEMP/contexts.jsonl"
          elif [ "$code" = 404 ]; then
            rm -f "$RUNNER_TEMP/var.json"
            code=$(jq -nc \
              '[{key: "NETLIFY_TOKEN", scopes: ["builds", "functions", "runtime"], values: [{context: "all", value: env.NETLIFY_AUTH_TOKEN}]}]' \
              | call POST "?site_id=$SITE_ID")
            echo "NETLIFY_TOKEN (all, created): HTTP $code"
            [ "$code" = 201 ] || [ "$code" = 200 ] || { echo "::error::could not create NETLIFY_TOKEN on the site"; exit 1; }
          else
            rm -f "$RUNNER_TEMP/var.json"
            echo "::error::reading NETLIFY_TOKEN's contexts answered HTTP $code"; exit 1
          fi

      - name: Build and deploy (production)
        working-directory: netlify-analytics
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          npx --yes "$NETLIFY_CLI" deploy --build --prod --site "$NETLIFY_SITE_ID" \
            --message "Deploy dashboards workflow: pisanuw/dashboards $REF ($SHA)"

      - name: Check the live site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
          BASE: ${{ steps.site.outputs.base }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=1" \
            | jq -r '.[0] | "Latest deploy: \(.state), \(.created_at), \(.title // "")"'
          fail=0
          legacy=0
          T="$RUNNER_TEMP/gate"; mkdir -p "$T"
          # Signed out, / is a redirect to /login or the sign-in form itself,
          # never the dashboard. 401 with a Basic challenge is the gate from
          # before the sign-in page (an older ref): still closed, so a warning.
          out=$(curl -s -o "$T/home.html" -D "$T/home.h" -w '%{http_code} %{redirect_url}' "$BASE/")
          code=${out%% *}; location=${out#* }
          case "$code" in
            301|302|303|307|308)
              case "$location" in
                "$BASE/login"*) echo "/ signed out: $code to the sign-in page";;
                *) echo "::error::/ signed out redirects to $location, not to the sign-in page"; fail=1;;
              esac;;
            200)
              if grep -q 'id="login-form"' "$T/home.html"; then echo "/ signed out: 200, the sign-in page"
              else echo "::error::/ answered 200 signed out with something other than the sign-in page"; fail=1; fi;;
            401)
              if grep -qi '^www-authenticate: *basic' "$T/home.h"; then
                legacy=1; echo "::warning::/ answers 401 with HTTP Basic auth: this ref predates the sign-in page"
              else echo "::error::/ answered 401 signed out without the sign-in page"; fail=1; fi;;
            *) echo "::error::/ signed out answered $code"; fail=1;;
          esac
          if [ "$legacy" = 0 ]; then
            # The form a browser can save the password from, and no cookie for it.
            code=$(curl -s -o "$T/login.html" -D "$T/login.h" -w '%{http_code}' "$BASE/login")
            if [ "$code" = 200 ] && grep -q 'autocomplete="current-password"' "$T/login.html" && ! grep -qi '^set-cookie:' "$T/login.h"; then
              echo "/login: 200, the sign-in form"
            else echo "::error::/login answered $code without the sign-in form"; fail=1; fi
            # A wrong password (random, not a secret) is refused and sets no session.
            code=$(curl -s -o /dev/null -D "$T/wrong.h" -w '%{http_code}' --data-urlencode 'username=owner' \
              --data-urlencode "password=not-the-password-$(openssl rand -hex 12)" --data-urlencode 'next=/' "$BASE/login")
            if [ "$code" = 401 ] && ! grep -qi '^set-cookie: *__Host-session=[^;]' "$T/wrong.h"; then
              echo "/login with a wrong password: 401, no session"
            else echo "::error::/login answered $code to a wrong password"; fail=1; fi
          fi
          # Every API path is closed signed out, as JSON 401, and (once the sign-in
          # page is live) with no Basic challenge that would bring the popup back.
          for p in /api/data /api/events /api/sync /api/config /.netlify/functions/data; do
            code=$(curl -s -o /dev/null -D "$T/api.h" -w '%{http_code}' "$BASE$p")
            echo "$p signed out: $code"
            [ "$code" = 401 ] || fail=1
            if [ "$legacy" = 0 ] && grep -qi '^www-authenticate: *basic' "$T/api.h"; then
              echo "::error::$p still sends a Basic auth challenge"; fail=1
            fi
          done
          rm -rf "$T"
          [ "$fail" = 0 ] || { echo "::error::$SITE is not closed signed out: check DASHBOARD_PASSWORD and the deployed edge function"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-report-secret: not-the-secret' https://auth.hintwise.org/functions/v1/app-events-report)
          case "$code" in
            401) echo "app-events-report: secret set (wrong secret refused)";;
            503) echo "::warning::app-events-report answers 503: run supabase-admin report-secret on";;
            *) echo "::warning::app-events-report answered $code to a wrong secret";;
          esac

# Point a hintwise.org or pisan.me name at a host outside Netlify (e.g. Render) with a
# DNS-only CNAME, deleting any A/AAAA record for that name. Deploys nothing.
name: Set CNAME

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Name to set, e.g. chesstd.hintwise.org'
        required: true
        type: string
      proxied:
        description: 'Proxy the record (only for an old name a redirect rule answers)'
        required: false
        default: false
        type: boolean
      target:
        description: 'CNAME target, e.g. chess-td-web.onrender.com'
        required: true
        type: string

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set CNAME
        run: node accessibility-lens/deploy/set-cname.mjs "$DOMAIN" "$TARGET"
        env:
          DOMAIN: ${{ inputs.domain }}
          TARGET: ${{ inputs.target }}
          PROXIED: ${{ inputs.proxied }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

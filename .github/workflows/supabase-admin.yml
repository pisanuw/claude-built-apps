# Admin tasks on the shared HintWise Supabase project (docs/platform.md).
# Secrets stay in GitHub; the script prints names and booleans, never values.
#
# Script commands (platform/supabase-admin.mjs):
#   inspect                  what is in the project today
#   sql <arg: file>          run one SQL file (shared platform SQL or an app's migration)
#   apply-shared             run platform/supabase/shared/*.sql, recording each in platform.migrations
#   migrate <arg: slug>      run <slug>/supabase/migrations/*.sql the same way
#   expose-schema <arg>      add a schema (platform, app_<slug_>) to PostgREST's db_schema
#   check-schema <arg>       read-only security check of a schema
#   configure-auth           additive auth settings; flags "--dry-run" and "--google"
#   keys                     print the URL and anon key as platform/supabase.json
#   usage [arg: days]        print the LLM usage report
#   domain-setup <arg: host> custom domain add-on: start it, create its Cloudflare records, verify
#   domain-status            where the custom domain stands (re-verifies while waiting)
#   domain-activate          flag --callbacks-ready: switch Auth to the custom domain
#   check-google [arg: return URL]  test the Google sign-in request without logging in; flag --base=URL for a custom auth domain
#   external-hosts           print HOOK_EXTERNAL_HOSTS (auth allow-list and site URL hosts minus hintwise.org)
#   brand-upload             create the public Storage bucket "brand" if missing and upload platform/brand
#                            (PNG, SVG, favicon.ico; one-year cache); prints EMAIL_LOGO_URL; idempotent
#   email-optout <arg: status | add | remove>  support for "Stop all email from HintWise": the address
#                            goes in the "email" input and is masked in the log before any step can show
#                            it; the log shows only the action, the time and the hash prefix. add on any
#                            request; remove ONLY on a request sent from that address that passes DMARC,
#                            or after a confirming reply from it
#   optout-ready             exit 1 unless platform.email_optout_check answers (deploy-function runs it
#                            first for sign-in-link and auth-email-hook)
# Shell commands (Supabase CLI, project dir platform/):
#   deploy-function <arg: name>  deploy platform/supabase/functions/<name> (verify_jwt from supabase/config.toml)
#   deploy-gateway           the same as deploy-function llm-gateway
#   set-gateway-key          set the ANTHROPIC_API_KEY function secret from the repo secret
#   set-sign-in-secrets      set the sign-in-link, auth-email-hook and email-optout function secrets
#                            (RESEND_API, ADMIN_EMAIL, TURNSTILE_SECRET, TURNSTILE_SITE_KEY,
#                            HOOK_EXTERNAL_HOSTS, EMAIL_LOGO_URL once the logo is served) and generate
#                            SIGN_IN_HASH_KEY, SEND_EMAIL_HOOK_SECRET and EMAIL_OPTOUT_SECRET once
#   email-hook <arg: status | check | on | off>  Supabase Auth's Send Email hook; "on" (owner's yes
#                            first) sets a fresh SEND_EMAIL_HOOK_SECRET in the function and in Auth;
#                            flag "--dry-run" with on
name: Supabase admin

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'inspect | sql | apply-shared | migrate | expose-schema | check-schema | configure-auth | keys | usage | check-google | domain-setup | domain-status | domain-activate | external-hosts | brand-upload | email-optout | optout-ready | deploy-function | deploy-gateway | set-gateway-key | set-sign-in-secrets | email-hook'
        required: true
        default: 'inspect'
        type: string
      arg:
        description: 'sql: file path; migrate: app slug; expose-schema, check-schema: schema; usage: days; check-google: return URL; domain-setup: host; deploy-function: function name; email-hook: status, check, on or off; email-optout: status, add or remove'
        required: false
        default: ''
        type: string
      email:
        description: 'email-optout only: the address (masked in the log, never printed)'
        required: false
        default: ''
        type: string
      flags:
        description: 'Flags for the script, e.g. "--google --dry-run" (configure-auth), "--write" (keys), "--base=https://auth.hintwise.org" (check-google), "--callbacks-ready" (domain-activate), "--dry-run", "--allow-otp-apps", "--accept-external-breakage" (email-hook on)'
        required: false
        default: ''
        type: string

concurrency:
  group: supabase-admin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      # keys --write commits platform/supabase.json (public URL and anon key).
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run
        if: inputs.command != 'deploy-function' && inputs.command != 'deploy-gateway' && inputs.command != 'set-gateway-key' && inputs.command != 'set-sign-in-secrets' && inputs.command != 'email-hook' && inputs.command != 'email-optout'
        run: node platform/supabase-admin.mjs "$CMD" $ARG $FLAGS
        env:
          CMD: ${{ inputs.command }}
          ARG: ${{ inputs.arg }}
          FLAGS: ${{ inputs.flags }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RESEND_API: ${{ secrets.RESEND_API }}
          HINTWISE_AUTH_GOOGLE_ID: ${{ secrets.HINTWISE_AUTH_GOOGLE_ID }}
          HINTWISE_AUTH_GOOGLE_SECRET: ${{ secrets.HINTWISE_AUTH_GOOGLE_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Only brand-upload and optout-ready use the service-role key.
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.command == 'brand-upload' || inputs.command == 'optout-ready') && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}

      - name: Mask the address
        if: inputs.command == 'email-optout'
        # Before any step can show it (a step's env is printed in the log, and
        # this repo's logs are public): the inputs are read from the event
        # file, not from expressions in the script. arg must be status, add or
        # remove (an address typed there by mistake stops the job here, never
        # printed). The address is masked for the rest of the job as typed,
        # trimmed and lower-cased, each with %, CR and LF escaped (%25, %0D,
        # %0A) as workflow commands require, so the mask is the exact value.
        run: |
          ARG=$(jq -r '.inputs.arg // ""' "$GITHUB_EVENT_PATH")
          case "$ARG" in status|add|remove) ;; *) echo "::error::email-optout takes arg status, add or remove (the address goes in the email input)"; exit 1;; esac
          RAW=$(jq -r '.inputs.email // ""' "$GITHUB_EVENT_PATH")
          [ -n "$RAW" ] || { echo "::error::email-optout needs the email input"; exit 1; }
          jq -r '.inputs.email // "" | (., gsub("^\\s+|\\s+$"; ""), (gsub("^\\s+|\\s+$"; "") | ascii_downcase)) | select(length > 0) | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' "$GITHUB_EVENT_PATH" \
            | sort -u | while IFS= read -r V; do echo "::add-mask::$V"; done

      - name: Email opt-out (support)
        if: inputs.command == 'email-optout'
        # The email-optout function hashes the address (only the functions
        # hold SIGN_IN_HASH_KEY) and answers with the short hash; the script
        # prints only the action, the time and the hash prefix. No access
        # token: this command uses only the service-role key.
        run: node platform/supabase-admin.mjs email-optout "$ARG"
        env:
          ARG: ${{ inputs.arg }}
          OPTOUT_EMAIL: ${{ inputs.email }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit platform/supabase.json
        # GitHub masks the anon key in the log, so keys --write commits the
        # file here instead of printing it for someone to copy. The anon key
        # is public by design (every app's bundle carries it); the
        # service-role key is never written.
        if: inputs.command == 'keys' && contains(inputs.flags, '--write')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/supabase.json
          if git diff --cached --quiet; then echo "platform/supabase.json unchanged."; exit 0; fi
          git commit -m "chore(platform): record the public Supabase URL and anon key"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "Committed platform/supabase.json."

      - uses: supabase/setup-cli@v1
        if: inputs.command == 'deploy-function' || inputs.command == 'deploy-gateway' || inputs.command == 'set-gateway-key' || inputs.command == 'set-sign-in-secrets' || inputs.command == 'email-hook'
        with:
          version: latest

      - name: Deploy an edge function
        if: inputs.command == 'deploy-function' || inputs.command == 'deploy-gateway'
        # The CLI reads SUPABASE_ACCESS_TOKEN from the environment. The project
        # dir is platform/ (it holds supabase/config.toml and
        # supabase/functions/<name>). The CLI (9 Nov 2026) asks before
        # changing a remote project and refuses without a terminal, so pass
        # --yes; it calls --project-ref deprecated in favour of --remote=<ref>,
        # so try --remote first and fall back for older CLIs. A function whose
        # config.toml section says verify_jwt = false also gets
        # --no-verify-jwt, so it stays public even if the CLI ignored the file.
        # sign-in-link and auth-email-hook send no email at all while the
        # opt-out list (0003_email_optout.sql) is missing, so they are
        # deployed only after optout-ready sees platform.email_optout_check
        # answer.
        working-directory: platform
        run: |
          REF=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https?://([a-z0-9]+)\.supabase\.co.*#\1#p')
          [ -n "$REF" ] || { echo "::error::SUPABASE_URL does not look like https://<ref>.supabase.co"; exit 1; }
          NAME="$ARG"
          [ "$CMD" = "deploy-gateway" ] && NAME="llm-gateway"
          printf '%s' "$NAME" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || { echo "::error::deploy-function needs the function name as arg, e.g. sign-in-link"; exit 1; }
          [ -f "supabase/functions/$NAME/index.ts" ] || { echo "::error::platform/supabase/functions/$NAME/index.ts does not exist"; exit 1; }
          grep -q "^\[functions\.$NAME\]" supabase/config.toml || { echo "::error::platform/supabase/config.toml has no [functions.$NAME] section"; exit 1; }
          VERIFY=$(awk -v s="[functions.$NAME]" '$0 == s { f = 1; next } /^\[/ { f = 0 } f && /^verify_jwt[ \t]*=/ { gsub(/[ \t]/, ""); split($0, a, "="); print a[2]; exit }' supabase/config.toml)
          EXTRA=""
          [ "$VERIFY" = "false" ] && EXTRA="--no-verify-jwt"
          case "$NAME" in sign-in-link|auth-email-hook) node supabase-admin.mjs optout-ready;; esac
          echo "Deploying $NAME (verify_jwt ${VERIFY:-true})"
          supabase functions deploy "$NAME" --remote="$REF" --yes $EXTRA \
            || supabase functions deploy "$NAME" --project-ref "$REF" --yes $EXTRA
        env:
          CMD: ${{ inputs.command }}
          ARG: ${{ inputs.arg }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # For optout-ready, before sign-in-link and auth-email-hook only.
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.arg == 'sign-in-link' || inputs.arg == 'auth-email-hook') && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}

      - name: Set the ANTHROPIC_API_KEY function secret
        if: inputs.command == 'set-gateway-key'
        # Secrets reach the CLI through a private env file (umask 077, removed
        # on exit), never as command-line arguments.
        working-directory: platform
        run: |
          set -euo pipefail
          REF=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https?://([a-z0-9]+)\.supabase\.co.*#\1#p')
          [ -n "$REF" ] || { echo "::error::SUPABASE_URL does not look like https://<ref>.supabase.co"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY repo secret is not set"; exit 1; }
          umask 077
          ENVF=$(mktemp)
          trap 'rm -f "$ENVF"' EXIT
          case "$ANTHROPIC_API_KEY" in *"'"*|*$'\n'*) echo "::error::ANTHROPIC_API_KEY has a quote or a newline"; exit 1;; esac
          printf "ANTHROPIC_API_KEY='%s'\n" "$ANTHROPIC_API_KEY" > "$ENVF"
          supabase secrets set --remote="$REF" --yes --env-file "$ENVF" >/dev/null \
            || supabase secrets set --project-ref "$REF" --yes --env-file "$ENVF" >/dev/null
          echo "Function secret ANTHROPIC_API_KEY set (value not shown)."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Set the sign-in function secrets
        if: inputs.command == 'set-sign-in-secrets'
        # RESEND_API and ADMIN_EMAIL from the repo secrets of the same names;
        # TURNSTILE_SECRET from the repo secret TURNSTILE_SECRET (or TURNSTILE_SECRET_KEY), which
        # must exist (without it sign-in-link pauses email sign-in whenever a
        # challenge is due); TURNSTILE_SITE_KEY from the repo variable or
        # secret TURNSTILE_SITE_KEY, else turnstileSiteKey in
        # platform/supabase.json (read with jq); HOOK_EXTERNAL_HOSTS from the
        # auth config (external-hosts: the redirect allow-list and site URL
        # hosts minus hintwise.org; host names, printed). EMAIL_LOGO_URL from
        # the repo variable EMAIL_LOGO_URL, else the brand bucket's email logo
        # on the custom domain, and only once that URL answers image/png (run
        # brand-upload first; until then the emails show the text wordmark).
        # SIGN_IN_HASH_KEY, SEND_EMAIL_HOOK_SECRET and EMAIL_OPTOUT_SECRET are
        # generated only when the project does not have them yet (a new hash
        # key would cut every address off its history and its opt-out; a new
        # opt-out secret would break every opt-out link already sent); the
        # names come from the Management API, which lists names and digests,
        # not values. Values reach the CLI through a private env file, never
        # as arguments, and the log shows booleans and the public logo URL only.
        working-directory: platform
        run: |
          set -euo pipefail
          REF=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https?://([a-z0-9]+)\.supabase\.co.*#\1#p')
          [ -n "$REF" ] || { echo "::error::SUPABASE_URL does not look like https://<ref>.supabase.co"; exit 1; }
          [ -n "$RESEND_API" ] || { echo "::error::RESEND_API repo secret is not set"; exit 1; }
          [ -n "$ADMIN_EMAIL" ] || { echo "::error::ADMIN_EMAIL repo secret is not set"; exit 1; }
          [ -n "$TURNSTILE_SECRET_KEY" ] || { echo "::error::Neither the TURNSTILE_SECRET nor the TURNSTILE_SECRET_KEY repo secret is set: without it email sign-in pauses whenever a challenge is due"; exit 1; }
          SITE_KEY="${TURNSTILE_SITE_KEY_REPO:-$(jq -r '.turnstileSiteKey // empty' supabase.json)}"
          [ -n "$SITE_KEY" ] || { echo "::error::no TURNSTILE_SITE_KEY repo value and no turnstileSiteKey in platform/supabase.json"; exit 1; }
          HOSTS_OUT=$(node supabase-admin.mjs external-hosts)
          printf '%s\n' "$HOSTS_OUT" | grep -v '^HOOK_EXTERNAL_HOSTS='
          HOSTS=$(printf '%s\n' "$HOSTS_OUT" | sed -n 's/^HOOK_EXTERNAL_HOSTS=//p')
          [ -n "$HOSTS" ] || { echo "::error::external-hosts printed no HOOK_EXTERNAL_HOSTS line"; exit 1; }
          NAMES=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/secrets" | jq -r '.[].name')
          has() { printf '%s\n' "$NAMES" | grep -qx "$1"; }
          umask 077
          ENVF=$(mktemp)
          trap 'rm -f "$ENVF"' EXIT
          put() {
            case "$2" in *"'"*|*$'\n'*) echo "::error::$1 has a quote or a newline; not set"; exit 1;; esac
            printf "%s='%s'\n" "$1" "$2" >> "$ENVF"
          }
          put RESEND_API "$RESEND_API"
          put ADMIN_EMAIL "$ADMIN_EMAIL"
          put TURNSTILE_SECRET "$TURNSTILE_SECRET_KEY"
          put TURNSTILE_SITE_KEY "$SITE_KEY"
          put HOOK_EXTERNAL_HOSTS "$HOSTS"
          HASH_NEW=false
          if ! has SIGN_IN_HASH_KEY; then
            V=$(openssl rand -hex 32); echo "::add-mask::$V"; put SIGN_IN_HASH_KEY "$V"; HASH_NEW=true
          fi
          HOOK_NEW=false
          if ! has SEND_EMAIL_HOOK_SECRET; then
            V="v1,whsec_$(openssl rand -base64 32)"; echo "::add-mask::$V"; put SEND_EMAIL_HOOK_SECRET "$V"; HOOK_NEW=true
          fi
          OPTOUT_NEW=false
          if ! has EMAIL_OPTOUT_SECRET; then
            V=$(openssl rand -hex 32); echo "::add-mask::$V"; put EMAIL_OPTOUT_SECRET "$V"; OPTOUT_NEW=true
          fi
          PUB=$(jq -r '.url // empty' supabase.json)
          LOGO="${EMAIL_LOGO_URL_REPO:-$PUB/storage/v1/object/public/brand/hintwise-wordmark-email@2x.png}"
          LOGO_TYPE=$(curl -fsSL -o /dev/null -w '%{content_type}' "$LOGO" || true)
          LOGO_SET=false
          if printf '%s' "$LOGO" | grep -Eq '^https://([a-z0-9-]+\.)*hintwise\.org/[A-Za-z0-9@._/-]+$'; then
            case "$LOGO_TYPE" in image/png*) put EMAIL_LOGO_URL "$LOGO"; LOGO_SET=true;; esac
          fi
          supabase secrets set --remote="$REF" --yes --env-file "$ENVF" >/dev/null \
            || supabase secrets set --project-ref "$REF" --yes --env-file "$ENVF" >/dev/null
          present() { if [ -n "$1" ]; then echo true; else echo false; fi; }
          echo "Function secrets set (values not shown):"
          echo "  RESEND_API: true"
          echo "  ADMIN_EMAIL: true"
          echo "  TURNSTILE_SECRET from repo secret TURNSTILE_SECRET (or TURNSTILE_SECRET_KEY): true"
          echo "  TURNSTILE_SITE_KEY from repo variable or secret TURNSTILE_SITE_KEY: $(present "$TURNSTILE_SITE_KEY_REPO") (false: platform/supabase.json turnstileSiteKey)"
          echo "  HOOK_EXTERNAL_HOSTS: $HOSTS"
          echo "  SIGN_IN_HASH_KEY generated now: $HASH_NEW (false: kept the one already set)"
          echo "  SEND_EMAIL_HOOK_SECRET generated now: $HOOK_NEW (false: kept the one already set)"
          echo "  EMAIL_OPTOUT_SECRET generated now: $OPTOUT_NEW (false: kept the one already set)"
          if [ "$LOGO_SET" = true ]; then echo "  EMAIL_LOGO_URL: $LOGO"; else echo "  EMAIL_LOGO_URL: not set now ($LOGO answers '${LOGO_TYPE:-nothing}', not image/png on hintwise.org; run brand-upload first)"; fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RESEND_API: ${{ secrets.RESEND_API }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          # The owner stored it as TURNSTILE_SECRET (10 Nov); TURNSTILE_SECRET_KEY also works.
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET || secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY_REPO: ${{ vars.TURNSTILE_SITE_KEY || secrets.TURNSTILE_SITE_KEY }}
          EMAIL_LOGO_URL_REPO: ${{ vars.EMAIL_LOGO_URL }}

      - name: Switch the Send Email hook
        if: inputs.command == 'email-hook'
        # status, check and off only call the script. on (owner's yes first):
        # a dry run of on first, which checks that auth-email-hook is deployed
        # with its secrets, that no app in this repo still calls
        # signInWithOtp, signUp or resend (flag --allow-otp-apps overrides)
        # and that some external host keeps its email (flag
        # --accept-external-breakage overrides); then a fresh secret, set as
        # the function secret through a private env file, then Auth's Send
        # Email hook pointed at the function with the same secret. The
        # function secret cannot be read back, so on always starts a new one;
        # while it replaces an old one, auth emails can fail for a few seconds.
        working-directory: platform
        run: |
          set -euo pipefail
          REF=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https?://([a-z0-9]+)\.supabase\.co.*#\1#p')
          [ -n "$REF" ] || { echo "::error::SUPABASE_URL does not look like https://<ref>.supabase.co"; exit 1; }
          case "$ARG" in
            on)
              node supabase-admin.mjs email-hook on --dry-run $FLAGS
              if printf '%s' "$FLAGS" | grep -q -- '--dry-run'; then exit 0; fi
              SECRET="v1,whsec_$(openssl rand -base64 32)"
              echo "::add-mask::$SECRET"
              umask 077
              ENVF=$(mktemp)
              trap 'rm -f "$ENVF"' EXIT
              printf "SEND_EMAIL_HOOK_SECRET='%s'\n" "$SECRET" > "$ENVF"
              supabase secrets set --remote="$REF" --yes --env-file "$ENVF" >/dev/null \
                || supabase secrets set --project-ref "$REF" --yes --env-file "$ENVF" >/dev/null
              echo "Function secret SEND_EMAIL_HOOK_SECRET replaced (value not shown)."
              SEND_EMAIL_HOOK_SECRET="$SECRET" node supabase-admin.mjs email-hook on $FLAGS
              ;;
            ''|status|check|off)
              node supabase-admin.mjs email-hook "${ARG:-status}" $FLAGS
              ;;
            *)
              echo "::error::email-hook takes status, check, on or off"; exit 1
              ;;
          esac
        env:
          ARG: ${{ inputs.arg }}
          FLAGS: ${{ inputs.flags }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

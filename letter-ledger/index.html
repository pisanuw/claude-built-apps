<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Light and dark mode: sets data-theme before the first paint (platform/src/theme/README.md; test/theme.test.ts pins it) -->
    <script>(function(){var t;try{t=localStorage.getItem('hw-theme')}catch{}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
    <title>Letter Ledger</title>
    <meta
      name="description"
      content="Recommendation letters without the inbox: a personal request link with your policy and a FERPA release, request files encrypted to your key, a deadline dashboard with calendar reminders and student status emails, notes on students during the term, and a fact outline per program. Runs entirely in the browser."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%89%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"><noscript>Letter Ledger needs JavaScript; everything runs in your browser.</noscript></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

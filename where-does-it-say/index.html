<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Light and dark mode: sets data-theme before the first paint (platform/src/theme/README.md; test/theme.test.ts pins it) -->
    <script>(function(){var t;try{t=localStorage.getItem('hw-theme')}catch{}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
    <title>Where Does It Say</title>
    <meta
      name="description"
      content="Ask a question about a course and get only verbatim sentences from the syllabus, specs and policies, highlighted in place, or a plain 'not in the documents'. Unanswered questions become a gap report for the instructor. Runs entirely in the browser."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"><noscript>Where Does It Say needs JavaScript; everything runs in your browser.</noscript></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# Minimal Supabase CLI project file so that `supabase functions deploy <name>`
# runs from platform/ (the "Supabase admin" workflow's deploy-function and
# deploy-gateway commands). No local stack is configured here; the CLI needs
# only the project id and each function's entry. Secrets (ANTHROPIC_API_KEY,
# RESEND_API, SIGN_IN_HASH_KEY, ...) are set with `supabase secrets set`
# (set-gateway-key, set-sign-in-secrets), never in this file.
project_id = "hintwise-platform"

[functions.llm-gateway]
# The platform checks the caller's JWT before the function runs; the function
# then verifies the user itself with auth.getUser.
verify_jwt = true
entrypoint = "./functions/llm-gateway/index.ts"

[functions.sign-in-link]
# Public: apps call it before anyone is signed in (anon key as apikey). It
# checks the Origin, the body and its own limits itself.
verify_jwt = false
entrypoint = "./functions/sign-in-link/index.ts"

[functions.auth-email-hook]
# Called by Supabase Auth (Send Email hook), which signs the request with
# Standard Webhooks instead of a JWT; the function verifies that signature
# (SEND_EMAIL_HOOK_SECRET).
verify_jwt = false
entrypoint = "./functions/auth-email-hook/index.ts"

[functions.email-optout]
# Public: the footer link of every HintWise email opens it in a browser with
# no session. A GET only shows a question; a POST needs the signed token
# (EMAIL_OPTOUT_SECRET) or, for support commands, the service-role key.
verify_jwt = false
entrypoint = "./functions/email-optout/index.ts"

[functions.app-notify]
# The daily app-notify run (shared/0011, src/notify). Not deployed yet. The
# check is a shared secret header (x-app-notify-secret = APP_NOTIFY_SECRET,
# at least 32 characters, compared in constant time), not the platform's JWT
# check: the anon key is public, so verify_jwt alone would let anyone start a
# run, and the service-role key does not belong in the scheduler.
verify_jwt = false
entrypoint = "./functions/app-notify/index.ts"

[functions.delete-account]
# A signed-in person deletes their own account. verify_jwt is off so the CORS
# preflight (no token) gets through; the function verifies the session token
# itself with GET /auth/v1/user and refuses anything else, and needs a
# sign-in from the last 15 minutes.
verify_jwt = false
entrypoint = "./functions/delete-account/index.ts"

[functions.credits-grant]
# A HintWise admin grants credits (shared/0008). Like llm-gateway, the
# platform checks the JWT first; the function then verifies the user and
# that they are in platform.admins.
verify_jwt = true

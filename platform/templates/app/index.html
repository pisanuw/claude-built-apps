<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLUG</title>
    <style>
      /* Keep body a column (or a plain block): the deploy adds a footer after #app. */
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
      #app { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1rem; }
      /* The top bar: the app's name at the left, sign-in at the right (it stays at the right when it wraps). */
      .top-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; }
      .top-bar h1 { margin: 0; min-width: 0; overflow-wrap: anywhere; }
      /* The sign-in panel adds its own styles: src/lib/signin-styles.ts. */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

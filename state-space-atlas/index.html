<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Light and dark mode: sets data-theme before the first paint (platform/src/theme/README.md; test/theme.test.ts pins it) -->
    <script>(function(){var t;try{t=localStorage.getItem('hw-theme')}catch{}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
    <title>State Space Atlas</title>
    <meta
      name="description"
      content="Enumerates every reachable state of Towers of Hanoi, sliding tiles, Klotski and Rush Hour, draws the whole state graph, animates BFS, DFS, IDDFS, greedy and A* over it, and checks your heuristic for admissibility and consistency against true distances. Runs entirely in the browser."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"><noscript>State Space Atlas needs JavaScript; everything runs in your browser.</noscript></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
